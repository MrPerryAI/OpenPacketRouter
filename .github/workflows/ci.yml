name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python dependencies
        run: pip install numpy matplotlib pytest jsonschema
      - name: Lab build is up to date
        run: python3 tools/build_web.py --check
      - name: Storm math proof of concept
        working-directory: poc/storm-math
        run: python3 -m pytest -q
      - name: Lab engine matches the proof of concept
        run: python3 -m pytest -q tests
      - name: Browser smoke test
        run: |
          npm install
          npx playwright install --with-deps chromium
          node tests/web/smoke.mjs
      - name: Studio smoke test
        run: node tests/studio/smoke.mjs
      - name: Engine unit tests
        working-directory: engine
        run: npm test
      - name: Engine vs real Linux (frame for frame)
        run: sudo env "PATH=$PATH" python3 validate/l3/run_kernel_l3.py
      - name: Engine L2 (STP + VLANs) vs real Linux
        run: sudo env "PATH=$PATH" python3 validate/l2/run_kernel_l2.py
      - name: Link shaping vs real Linux tbf (frame for frame)
        run: sudo env "PATH=$PATH" python3 validate/links/run_kernel_links.py
      - name: DHCP vs real Linux (dnsmasq + udhcpc, frame for frame)
        run: |
          sudo apt-get install -y --no-install-recommends dnsmasq-base busybox-static tcpdump >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dnsmasq-base busybox-static tcpdump >/dev/null)
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true OPR_CAPTURE=1 python3 validate/dhcp/run_kernel_dhcp.py
      - name: TCP vs real Linux (frame for frame)
        run: sudo env "PATH=$PATH" python3 validate/tcp/run_kernel_tcp.py
