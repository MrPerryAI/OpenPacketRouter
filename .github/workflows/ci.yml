name: CI
on:
  push:
    branches: [main]
  pull_request:
# One run per pull request (or per push to main); a newer push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python dependencies
        run: pip install numpy matplotlib pytest jsonschema
      - name: Lab build is up to date
        run: python3 tools/build_web.py --check
      - name: Storm math proof of concept
        working-directory: poc/storm-math
        run: python3 -m pytest -q
      - name: Lab engine matches the proof of concept
        run: python3 -m pytest -q tests
      - name: Browser smoke test
        run: |
          npm install
          npx playwright install --with-deps chromium
          node tests/web/smoke.mjs
      - name: Studio smoke test
        run: node tests/studio/smoke.mjs
      - name: Engine unit tests
        working-directory: engine
        run: npm test
      - name: Device CLI tests (incl. running-config round trip on every spec)
        working-directory: cli
        run: npm test
      - name: CLI reference and lab commands.txt are up to date
        run: |
          node cli/tools/gen-reference.mjs --check
          node cli/tools/gen-commands.mjs --check
      - name: Engine vs real Linux (frame for frame)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/l3/run_kernel_l3.py
      - name: Engine L2 (STP + VLANs) vs real Linux
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/l2/run_kernel_l2.py
      - name: Inter-VLAN routing (subinterfaces + SVIs) vs real Linux
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/intervlan/run_kernel_intervlan.py
      - name: MAC address aging vs real Linux bridges (ageing_time, frame for frame)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/aging/run_kernel_aging.py
      - name: Port security vs real Linux (nftables bridge sets, frame for frame)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/portsec/run_kernel_portsec.py
      - name: STP topology change notices vs real Linux bridges (flags, aging, MAC tables)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/tcn/run_kernel_tcn.py
      - name: LACP port-channels vs real Linux bonds (802.3ad, states, LACPDUs, hash per cable)
        run: |
          sudo modprobe bonding || true
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/lacp/run_kernel_lacp.py
      - name: Link shaping vs real Linux tbf (frame for frame)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/links/run_kernel_links.py
      - name: DHCP vs real Linux (dnsmasq + udhcpc, frame for frame)
        run: |
          sudo apt-get install -y --no-install-recommends dnsmasq-base busybox >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dnsmasq-base busybox >/dev/null)
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/dhcp/run_kernel_dhcp.py
      - name: TCP vs real Linux (frame for frame)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/tcp/run_kernel_tcp.py
      - name: Access lists vs Linux nftables (frames, pings, UDP and TCP connects)
        run: validate/docker/run.sh acl
      - name: NAT vs Linux nftables (masquerade, snat and dnat; frames, pings, TCP and UDP)
        run: validate/docker/run.sh nat
      - name: IPv6 vs Linux (neighbor discovery, ICMPv6 echo, static routes; frames on every cable)
        run: validate/docker/run.sh ipv6
      - name: RIPv2 vs FRRouting ripd (tables and packets on every cable)
        # Runs in the project's privileged container (validate/docker/Dockerfile has frr), like `run.sh rip` locally.
        run: |
          # The runner's AppArmor ships an enforcing "ripd" profile (no zebra one); host profiles also bind to
          # /usr/lib/frr/ripd inside privileged containers, and it denies ripd's pid lock file in our per-router dirs.
          # Unload it for this job; the comparison against real ripd is unchanged.
          sudo aa-status 2>/dev/null | grep -iE 'frr|ripd|zebra' || true
          f=$(grep -lE '^ *profile +ripd\b' /etc/apparmor.d/* 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "unloading AppArmor profile $f"; grep -E 'pid|/run' "$f" | head -5 || true; sudo apparmor_parser -R "$f"; fi
          sudo aa-status 2>/dev/null | grep -iE 'ripd' && { echo "ripd profile still loaded"; exit 1; } || true
          validate/docker/run.sh rip
      - name: RIPng vs FRRouting ripngd (tables and packets on every cable)
        run: |
          # Same AppArmor handling as for ripd above.
          f=$(grep -lE '^ *profile +ripngd\b' /etc/apparmor.d/* 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "unloading AppArmor profile $f"; sudo apparmor_parser -R "$f"; fi
          validate/docker/run.sh ripng
      - name: Device CLI's Linux backend vs engine (devices configured only by the CLI, frame for frame)
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 validate/cli/run_kernel_cli.py
      - name: OSPFv2 vs FRRouting ospfd (neighbors, DR/BDR, routes, LSDB and packets on every cable)
        # Runs in the project's privileged container (validate/docker/Dockerfile has frr), like `run.sh ospf` locally.
        run: |
          # The runner's AppArmor may ship an enforcing "ospfd" profile (as it does for ripd); host profiles also bind to
          # /usr/lib/frr/ospfd inside privileged containers and deny its pid lock file in our per-router dirs.
          # Unload it for this job; the comparison against real ospfd is unchanged.
          sudo aa-status 2>/dev/null | grep -iE 'frr|ospfd|zebra' || true
          f=$(grep -lE '^ *profile +ospfd\b' /etc/apparmor.d/* 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "unloading AppArmor profile $f"; grep -E 'pid|/run' "$f" | head -5 || true; sudo apparmor_parser -R "$f"; fi
          sudo aa-status 2>/dev/null | grep -iE 'ospfd' && { echo "ospfd profile still loaded"; exit 1; } || true
          validate/docker/run.sh ospf
          # Same comparison again, but ospfd is configured from the device CLI (model -> FRR rendering); any mismatch fails
          OSPF_RENDER=cli validate/docker/run.sh ospf
      - name: LLDP vs lldpd (neighbor tables, LLDPDU contents and counts on every cable)
        # Runs in the project's privileged container (validate/docker/Dockerfile has lldpd), like `run.sh lldp` locally.
        run: |
          # The runner's AppArmor may confine a host "lldpd" profile onto the container's lldpd (as it does for ripd and
          # ospfd); lldpd needs its control socket and /run dirs. Unload it for this job; the comparison is unchanged.
          sudo aa-status 2>/dev/null | grep -iE 'lldpd' || true
          f=$(grep -lE '^ *(profile +)?[^ ]*lldpd\b' /etc/apparmor.d/* 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "unloading AppArmor profile $f"; sudo apparmor_parser -R "$f" || true; fi
          validate/docker/run.sh lldp
