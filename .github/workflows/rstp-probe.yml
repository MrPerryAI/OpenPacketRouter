name: RSTP probe
on:
  push:
    branches: [stp-vlan-rstp]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mstpd on the runner host
        shell: bash {0}
        run: |
          uname -r
          sudo apt-get update -qq; apt-cache policy mstpd | head -3
          sudo apt-get install -y --no-install-recommends tcpdump build-essential git >/dev/null
          git clone -q --depth 1 https://github.com/mstpd/mstpd /tmp/mstpd-src; ls /tmp/mstpd-src
          sudo apt-get install -y autoconf automake libtool pkg-config >/dev/null 2>&1
          cd /tmp/mstpd-src && ( ./autogen.sh 2>&1 | tail -5; ./configure --prefix=/usr --sysconfdir=/etc 2>&1 | tail -5; make -j4 2>&1 | tail -8; sudo make install 2>&1 | tail -8 ); cd -
          git -C /tmp/mstpd-src log --oneline -1; which mstpd mstpctl; ls -la /sbin/bridge-stp
          sudo systemctl start mstpd || true
          sleep 1; pgrep -a mstpd || (sudo mstpd -d -v 2 >/tmp/mstpd.log 2>&1 &) ; sleep 1; pgrep -a mstpd
          sudo ip link add b1 type bridge; sudo ip link add b2 type bridge
          sudo ip link add v1a type veth peer name v1b
          sudo ip link set v1a master b1; sudo ip link set v1b master b2
          sudo ip link set b1 up; sudo ip link set b2 up; sudo ip link set v1a up; sudo ip link set v1b up
          sudo ip link set b1 type bridge stp_state 2
          sudo ip link set b2 type bridge stp_state 2
          cat /sys/class/net/b1/bridge/stp_state
          sudo mstpctl setforcevers b1 rstp; sudo mstpctl setforcevers b2 rstp
          (sudo timeout 6 tcpdump -ni v1a -e -vv stp 2>&1 | head -40) &
          sleep 8
          sudo mstpctl showbridge b1 | head -30
          sudo mstpctl showport b1 | head
          sudo mstpctl showport b2 | head
          sudo mstpctl showportdetail b1 v1a | head -40
